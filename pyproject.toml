[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fixit"
version = "0.1.0"
description = "Beginner-friendly Python CLI with planted bugs to practice open source contributions"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "codepiyusss" }
]


[project.urls]
Homepage = "https://github.com/codepiyusss/open_source_issue_contribution"
Repository = "https://github.com/codepiyusss/open_source_issue_contribution"
Issues = "https://github.com/codepiyusss/open_source_issue_contribution/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.12.0", "mypy>=1.0,<2", "pytest-cov"]

[project.scripts]
fixit = "fixit.cli:main"

[tool.setuptools]
packages = ["fixit"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
"fixit/cli.py" = ["FA100"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
