name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Help for contributors
        if: failure()
        run: echo "Tests failed. This is normal on a first try. Open the Run tests step above to see which test failed, fix it and push again. Ask in your PR if you are stuck."
