
name: Welcome First-Time Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Greet New Contributors
    runs-on: ubuntu-latest

    steps:
      - name: Greet First-Time Contributor
        uses: actions/first-interaction@v1.3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          issue-message: |
            Welcome @${{ github.actor }}!

            Thank you for opening your first issue. We're excited to have you here.

            Please read our [CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md) for guidelines on how to contribute.

          pr-message: |
            Welcome @${{ github.actor }}!

            Thank you for your first Pull Request! We're excited to have your contribution.

            Please ensure your PR description includes `Closes #<issue_number>` and that all CI checks are passing.

            For more details, check out our [CONTRIBUTING.md](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md).
